# Default values for fixora.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/baka126/fixora
  pullPolicy: IfNotPresent
  tag: "v0.5.2"

_UI: false

allowedOrigins: ["*"] # List of allowed WebSocket origins (e.g., ["dashboard.example.com", "localhost:5173"]). Use ["*"] to allow all (not recommended for production).

ui:
  enabled: false
  replicaCount: 1
  apiBaseUrl: "/api"
  image:
    repository: ghcr.io/baka126/fixora-ui
    pullPolicy: IfNotPresent
  tag: "v0.5.2"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  resources: {}

logLevel: "INFO" # DEBUG, INFO, WARN, ERROR
clusterName: "Groov-Prod" # Optional display name used when Kubernetes/provider metadata cannot expose a stable cluster name.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

slack:
  token: ""
  signingSecret: ""
  channel: ""
  appMode: false # Set to true to enable interactive buttons and modals (requires Slack App configuration)

googleChat:
  webhookUrl: ""
  appMode: false # Set to true if configured as a full Chat App (enables interactive buttons)

prometheus:
  url: "http://prometheus-operated.monitoring.svc.cluster.local:9090"

alertmanager:
  enabled: true
  url: "http://alertmanager-operated.monitoring.svc.cluster.local:9093"

ai:
  provider: "gemini" # "gemini", "openai", "anthropic"
  model: ""
  apiKey: ""
  baseUrl: "" # Custom Base URL for OpenAI-compatible APIs (e.g., self-hosted Ollama, vLLM)

mode: "dry-run" # Options: "auto-fix" (auto-PR), "click-to-fix" (manual approval via Slack/Chat), "dry-run" (report only)
modePolicy:
  approvalTTL: "24h"
  autoFixMaxPRPerHour: 20
  dryRunIncludePatch: true

investigation:
  # Suppress repeat AI investigations for the same workload and failure scenario.
  cooldown: "12h"
  # Suppress repeat Alertmanager-driven diagnostics for the same namespace/pod/alert.
  alertmanagerDedupWindow: "12h"

ha:
  enabled: true
  leaseName: "fixora-leader-election"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"

webhook:
  token: ""
  user: ""
  password: ""

auditWebhook:
  url: ""
  token: ""

auth:
  # JWT signing secret for UI/API sessions. Leave empty to let the Helm chart
  # generate and preserve a 32-character secret in the release Secret.
  jwtSecret: ""

rbac:
  clusterScoped: true
  allowDeploymentMutations: false

# Privacy Config
privacy:
  sendGitToAI: true      # Set to false to prevent sending Git diffs to AI (disables remediation)
  scrubGitContent: true   # Set to true to tokenize sensitive information in Git diffs before sending to AI
  customLogScrubbingPatterns: [] # List of custom regex patterns to scrub from logs and events before sending to AI (e.g., `["(?i)ssn[:\s]+[0-9\-]+"]`)

# Validation & Policy Guardrails
validation:
  sandboxEnabled: true    # Run patches through a local sandbox (helm template/kustomize build)
  requireRender: false     # Fail remediation if render tool (helm/kustomize) is missing in sandbox
  toolTimeout: 15s        # Max time for sandbox validation commands

policyGuardrails:
  enabled: true           # Enable hard policy checks (RBAC protection, registry allowlisting)
  allowedImageRegistries: [] # List of trusted registries (e.g., ["ghcr.io", "docker.io"]). Empty means all are allowed.
  allowedReplacementImages: [] # Optional pinned/verified replacement images (e.g., ["alexeiled/stress-ng:0.12.05", "registry.example.com/*"]). Empty means any pinned non-latest replacement image is allowed, except CPU architecture fixes require an explicit verified image here.

# FinOps Config
finops:
  infracostAPIKey: ""
  revenuePerRequest: 0.0
  latencyThresholdMS: 500.0
  latencyPenaltyPerHour: 0.0

# Feature Toggles (Modular Architecture)
features:
  # Watch K8s Events and Pod status changes (Highly efficient)
  k8sWatcher:
    enabled: true
  
  # Scan for 5xx errors and Latency spikes via Prometheus (Bulk queries)
  performanceScanner:
    enabled: false
    thresholds:
      errorRate: 0.05    # 5% threshold
      latency: 2.0      # 2 second P99 threshold
    slo:
      availabilityObjective: 0.99
      burnRateThreshold: 14.4
      shortWindow: 5m
      longWindow: 1h
  
  # Scan for memory leak trajectories via Prometheus
  leakScanner:
    enabled: true

  # Scan for over-provisioned workloads and open right-sizing remediation plans
  rightSizing:
    enabled: false
    scanInterval: 6h
    lookback: 720h # 30 days
    peakThreshold: 0.35 # peak memory usage must stay below 35% of request
    safetyFactor: 1.5 # recommended request = peak usage * safety factor
    minMonthlySavings: 1.0
  
  # Pull firing alerts from Alertmanager API
  alertmanagerScraper:
    enabled: true
    # Optional label filters to reduce noise
    includeLabels: {}
      # fixora: "true"
      # severity: "critical"
    excludeLabels: {}
      # alertname: "Watchdog"

  # ArgoCD integration for repo discovery
  argocd:
    enabled: false
    namespace: "argocd"
    url: ""
    token: ""

  # Predictive analysis & historical state
  predictive:
    enabled: true
    growthThreshold: 0.20
    scanInterval: 5m
    minDataPoints: 10

  # Dedicated database for state and history
  database:
    host: ""
    port: "5432"
    user: "fixora"
    password: ""
    name: "fixora"
    sslMode: "disable"
    embedded:
      enabled: true
      image:
        repository: postgres
        tag: "16-alpine"
        pullPolicy: IfNotPresent
      storage:
        enabled: true
        size: 8Gi
        storageClassName: ""
      resources: {}

# Scoping (Scale-aware)
scoping:
  includedNamespaces: [] # Empty means all namespaces except excluded
  excludedNamespaces: ["kube-system", "monitoring", "fixora"]

# Gateway API support
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

vcs:
  github:
    token: ""
  gitlab:
    token: ""
    baseUrl: ""
  trustedDomains: ["github.com", "gitlab.com"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  namespace: ""
  additionalLabels: {}
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []

networkPolicy:
  enabled: false
