apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRole" "Role" .Values.rbac.clusterScoped }}
metadata:
  name: {{ include "fixora.fullname" . }}
  {{- if not .Values.rbac.clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "resourcequotas"]
  verbs: ["get", "list", "watch"]
{{- if .Values.rbac.clusterScoped }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- end }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["fixora-vcs"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs:
    - get
    - list
    - watch
    {{- if .Values.rbac.allowDeploymentMutations }}
    - update
    - patch
    {{- end }}
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- if .Values.features.argocd.enabled }}
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRoleBinding" "RoleBinding" .Values.rbac.clusterScoped }}
metadata:
  name: {{ include "fixora.fullname" . }}
  {{- if not .Values.rbac.clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
subjects:
- kind: ServiceAccount
  name: {{ include "fixora.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: {{ ternary "ClusterRole" "Role" .Values.rbac.clusterScoped }}
  name: {{ include "fixora.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
