{{- if include "fixora.uiEnabled" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixora.uiFullname" . }}-config
  labels:
    {{- include "fixora.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
data:
  config.js: |
    window.FIXORA_CONFIG = {
      apiBaseUrl: {{ .Values.ui.apiBaseUrl | quote }}
    };
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://{{ include "fixora.fullname" . }}:{{ .Values.service.port }}/api/;
      }
    }
{{- end }}
