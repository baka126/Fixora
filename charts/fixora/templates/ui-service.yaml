{{- if include "fixora.uiEnabled" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixora.uiFullname" . }}
  labels:
    {{- include "fixora.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "fixora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
